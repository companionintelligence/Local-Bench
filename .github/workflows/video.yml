# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ONE CAPTURE RUN CANNOT FILM BOTH STAGE STATES. video-kit calls
      # capture.config.mjs's `onContext` once per viewport context, BEFORE the
      # per-shot loop, so its route mocks are global to the whole run. Local Bench
      # therefore captures twice, once per LB_CAPTURE_SCENARIO.
      #
      # ⚠ Every shot id in video/storyboard.json must appear in exactly ONE of
      #   these lists. A shot in neither is never captured, and video-kit silently
      #   substitutes a branded "capture pending" slate for a missing PNG — the
      #   build still goes green. That silent substitution is the failure this
      #   split exists to prevent, so the "Verify shot coverage" step below fails
      #   the run the moment these lists and the storyboard drift apart.
      SHOTS_FIRST_RUN: dashboard-hero,model-catalog,prompt-picker,prompt-library,run-controls,intelligence-index,docs
      SHOTS_BENCHMARKED: models-installed,benchmark-complete,system-specs,response-compare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # Without a scope, setup-node writes a bare `registry=` line into ~/.npmrc
          # and routes EVERY package at GitHub Packages, so public deps (playwright)
          # 404 on install. Scope it so only @companionintelligence goes there.
          scope: "@companionintelligence"

      - name: Install video project
        working-directory: video
        run: npm install
        env:
          # @companionintelligence/video-kit is published out of CI-Common and the
          # package is PRIVATE. secrets.GITHUB_TOKEN is scoped to THIS repository and
          # has no read access to it, so this step 403s with
          #   "permission_denied: read_package"
          # until one of these is done ONCE (both are outside this repo):
          #   a) CI-Common → Packages → video-kit → Package settings → Manage Actions
          #      access → add companionintelligence/Local-Bench with Read. This makes
          #      the secrets.GITHUB_TOKEN fallback below start working. Web UI only —
          #      there is no REST endpoint for it.
          #   b) or add a CI_PACKAGES_READ_TOKEN org secret holding a PAT with
          #      read:packages, which this expression prefers when it exists.
          # This is fleet-wide, not a Local-Bench bug: every repo with a video/
          # project fails at this same step for the same reason.
          NODE_AUTH_TOKEN: ${{ secrets.CI_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # Local Bench serves its static UI from its own Node server (src/server.ts).
      # There is no Playwright `webServer` to reuse: the repo's only Playwright
      # config, tests/container/playwright.config.ts, deliberately has none — it
      # targets an already-running container on :8080.
      #
      # This MUST run from the repo root: STATIC_ROOT = process.cwd()
      # (src/server.ts:16), so index.html and assets/ only resolve from there.
      #
      # No Ollama is installed on the runner, so /api/models answers 503 with the
      # curated catalog. That is exactly the first-run state the storyboard films,
      # and video/capture.config.mjs pins it so a laptop capture matches.
      - name: Start app
        env:
          PORT: "3000"
        run: |
          npm ci
          npm run build
          nohup node dist/server.js > /tmp/local-bench-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/ > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null

      # A benchmark run writes rows into benchmark_data.db (src/database.ts:22) and
      # the dashboard renders them. The runner's DB is empty on a fresh checkout —
      # assert that, so a stray committed DB can never silently change the shots.
      #
      # This still holds after the scenario split: `benchmarked` mocks /api/models,
      # /api/system-specs and POST /api/run-benchmark at the route layer and
      # deliberately leaves /api/results alone, so this gate stays orthogonal.
      - name: Assert empty results (capture determinism)
        run: |
          test "$(curl -fsS http://localhost:3000/api/results)" = "[]"

      # The `benchmarked` scenario replays video/fixtures/run-fixture.json. Fail loudly
      # if it stops parsing, or if it names a model the picker no longer offers — that
      # would film a run of models the curated catalog does not contain.
      - name: Verify capture fixture
        run: |
          node -e "
            const fs = require('node:fs');
            const { SUPPORTED_OLLAMA_MODELS } = require('./dist/benchmark.js');
            const fixture = JSON.parse(fs.readFileSync('video/fixtures/run-fixture.json', 'utf8'));
            const catalog = new Set(SUPPORTED_OLLAMA_MODELS.map(m => m.name));
            const named = [...new Set([
              ...fixture.installedModels,
              ...fixture.run.results.map(r => r.model),
            ])];
            const stray = named.filter(n => !catalog.has(n));
            if (stray.length) {
              console.error('  x fixture names models absent from SUPPORTED_OLLAMA_MODELS: ' + stray.join(', '));
              process.exit(1);
            }
            console.log('  fixture ok: ' + named.join(', '));
          "

      # The guard that makes the two-pass split safe: if a shot is declared in the
      # storyboard but listed in neither pass it is never captured, and video-kit
      # renders it as a branded slate without failing. Catch that here instead.
      - name: Verify shot coverage
        run: |
          node -e "
            const fs = require('node:fs');
            const sb = JSON.parse(fs.readFileSync('video/storyboard.json', 'utf8'));
            const declared = sb.scenes.flatMap(s => (s.shots ?? []).map(x => x.id));
            const listed = [
              ...process.env.SHOTS_FIRST_RUN.split(','),
              ...process.env.SHOTS_BENCHMARKED.split(','),
            ].map(s => s.trim()).filter(Boolean);
            const errs = [];
            const uncaptured = declared.filter(id => !listed.includes(id));
            const twice = listed.filter((id, i) => listed.indexOf(id) !== i);
            const unknown = listed.filter(id => !declared.includes(id));
            if (uncaptured.length) errs.push('declared in storyboard.json but captured by neither pass, so it would silently render as a slate: ' + uncaptured.join(', '));
            if (twice.length) errs.push('listed in both passes, so the second pass overwrites the first: ' + twice.join(', '));
            if (unknown.length) errs.push('listed in a pass but not declared in storyboard.json: ' + unknown.join(', '));
            if (errs.length) { errs.forEach(e => console.error('  x ' + e)); process.exit(1); }
            console.log('  shot coverage ok: ' + declared.length + ' shot(s) across 2 scenario passes');
          "

      # Pass 1 — the FTUE. No Ollama daemon: every model card disabled, the amber
      # "Ollama unavailable" pill, the welcome banner, empty results.
      - name: Capture (first-run)
        working-directory: video
        env:
          LB_CAPTURE_SCENARIO: first-run
        run: npm run capture -- --only "$SHOTS_FIRST_RUN"

      # Pass 2 — the working state. Ollama connected with the fixture's catalog
      # models installed, and a completed run: the success notice, the response
      # comparison and the system specifications card.
      - name: Capture (benchmarked)
        working-directory: video
        env:
          LB_CAPTURE_SCENARIO: benchmarked
        run: npm run capture -- --only "$SHOTS_BENCHMARKED"

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      # NOT REDUNDANT — do not delete. The ubuntu-24.04 runner image ships no
      # FFmpeg, and `npm run render` needs both binaries: ffmpeg to encode the
      # MP4s and ffprobe to probe the media assets. Without this the render step
      # aborts with "FFmpeg not found" / "FFprobe not found" and no video is ever
      # produced, even though capture succeeded.
      #
      # Guarded by the same condition as Render so a capture-only dispatch
      # (render=false) does not pay for the apt install.
      - name: Install FFmpeg
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-local-bench-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Local Bench product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
